[project]
name = "kxco-verify"
version = "1.1.0"
description = "Receiver-side verifier for the KXCO hybrid HMAC + ML-DSA-65 webhook signature scheme"
authors = [{ name = "KXCO by Knightsbridge", email = "hello@kxco.ai" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["post-quantum", "ml-dsa", "dilithium", "webhook", "fips-204", "kxco"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
# Bounded deliberately. liboqs-python reassigns algorithm identifiers between
# releases: 0.16.0 removed SPHINCS+ in favour of SLH-DSA and renamed FrodoKEM
# to ephemeral FrodoKEM, with the salted variant taking the OLD names. An
# unbounded range therefore lets a pinned identifier silently select a
# different algorithm. 0.16.0 is also the only release on PyPI today, so this
# bound excludes nothing that was installable.
oqs = ["liboqs-python>=0.16.0,<0.17"]
pqcrypto = ["pqcrypto>=0.3"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://kxco.ai"
Documentation = "https://chain.kxco.ai/wallet/dev-docs"
Repository = "https://github.com/JackKXCO/kxco-post-quantum-verifiers"

[tool.setuptools]
# Single-module flat layout. Excludes test_kxco_verify.py from the wheel.
py-modules = ["kxco_verify"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
