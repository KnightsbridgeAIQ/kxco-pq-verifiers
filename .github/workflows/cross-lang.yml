name: cross-language compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript:
    name: JavaScript / Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install latest kxco-post-quantum
        run: npm install kxco-post-quantum@latest
      - name: Smoke-import
        run: node -e "import('kxco-post-quantum').then(m => console.log(Object.keys(m)))"

  go:
    # The version is READ FROM go.mod rather than written here, and that is the
    # whole fix. This job pinned '1.22' while go/go.mod has required a newer Go
    # since 19 July, and it passed anyway because Go silently downloads the
    # toolchain a module asks for. actions/setup-go@v7 sets GOTOOLCHAIN=local,
    # which turns that download off, and the mismatch surfaced immediately as
    # "go.mod requires go >= 1.25.0 (running go 1.22.12; GOTOOLCHAIN=local)".
    #
    # Pinning the right number here would fix today and drift again the next time
    # a dependency raises the go directive, which is exactly how this happened.
    # go-version-file cannot drift: there is one number and the module owns it.
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - run: go mod tidy
      - run: go test ./...

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python test_kxco_verify.py

  rust:
    name: Rust / stable
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features

  vectors-checksum:
    name: Vectors file integrity
    runs-on: ubuntu-latest
    needs: [javascript, go, python, rust]
    steps:
      - uses: actions/checkout@v7
      - name: Confirm vectors.json is byte-identical across language dirs
        run: |
          sha256sum vectors/vectors.json
          echo "All language verifiers above passed against this exact file."
