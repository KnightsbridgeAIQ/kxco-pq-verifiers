[package]
name        = "kxco-verify"
version     = "1.2.2"
edition     = "2021"
license     = "MIT"
description = "Receiver-side verifier for the KXCO hybrid HMAC and ML-DSA webhook signature scheme, ML-DSA-87 and ML-DSA-65 (FIPS 204)"
homepage    = "https://kxco.ai"
repository  = "https://github.com/KnightsbridgeAIQ/kxco-pq-verifiers"
keywords    = ["post-quantum", "ml-dsa", "dilithium", "webhook", "fips-204"]
categories  = ["cryptography"]
readme      = "README.md"

[dependencies]
hex          = "0.4"
hmac         = "0.12"
sha2         = "0.10"
subtle       = "2.5"
# ML-DSA-87 and ML-DSA-65 verification backend, a pure-Rust FIPS 204 implementation
fips204      = "0.4"

[dev-dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
